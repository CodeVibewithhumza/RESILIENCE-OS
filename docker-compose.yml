version: '3.8'

services:
  db:
    image: postgres:15
    container_name: resilienceos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resilience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resilience_secret}
      POSTGRES_DB: ${POSTGRES_DB:-resilienceos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resilience} -d ${POSTGRES_DB:-resilienceos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: resilienceos-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-resilience}:${POSTGRES_PASSWORD:-resilience_secret}@db:5432/${POSTGRES_DB:-resilienceos}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/hospital/state"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resilienceos-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: resilienceos-network

volumes:
  postgres_data:
